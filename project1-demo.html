<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Information Management with GIS - Demo</title>
  <link rel="stylesheet" href="style.css" />
   <link rel="icon" type="image/x-icon" href="Images/DSCF6945.gif">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    body { background: #f8fafc; margin: 0; font-family: 'Poppins', sans-serif; }
    .demo-container {
      max-width: 480px;
      margin: 48px auto;
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 8px 32px #0004, 0 2px 12px #f1c40f22;
      padding: 32px 18px 24px 18px;
    }
    .demo-title {
      text-align: center;
      font-size: 1.5rem;
      font-weight: 700;
      color: #23272f;
      margin-bottom: 18px;
      letter-spacing: 1px;
    }
    .demo-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 18px;
      justify-content: center;
    }
    .demo-tab {
      background: #f1c40f22;
      border: none;
      border-radius: 8px 8px 0 0;
      padding: 10px 24px;
      font-size: 1rem;
      font-weight: 600;
      color: #23272f;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }
    .demo-tab.active, .demo-tab:hover {
      background: #f1c40f;
      color: #23272f;
    }
    .demo-tab-content {
      padding: 18px 0 0 0;
      min-height: 120px;
      text-align: center;
    }
    .demo-screenshot-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      color: #888;
    }
    .desktop-gallery {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
      margin-top: 8px;
    }
    .desktop-gallery img {
      max-width: 180px;
      border-radius: 12px;
      box-shadow: 0 4px 16px #f1c40f33, 0 2px 8px #0002;
      border: 2px solid #ffe066;
      background: #fffbe6;
      transition: transform 0.18s, box-shadow 0.18s;
      margin-bottom: 6px;
    }
    .desktop-gallery img:hover {
      transform: scale(1.07);
      box-shadow: 0 8px 32px #f1c40f55;
      border-color: #f1c40f;
    }
    @media (max-width: 600px) {
      .demo-container {
        max-width: 98vw;
        padding: 12px 2vw 10px 2vw;
      }
      .demo-tab { padding: 8px 10px; font-size: 0.95rem; }
      .desktop-gallery {
        flex-wrap: nowrap;
        overflow-x: auto;
        gap: 12px;
        padding-bottom: 8px;
      }
      .desktop-gallery img {
        max-width: 120px;
      }
    }
  </style>
</head>
<body>
  <div class="demo-container">
    <div class="demo-title">Integrated Information Management with Geographic Information System</div>
    <div class="demo-tabs">
      <button class="demo-tab active" id="demoTabMobile">Web Development</button>
      <button class="demo-tab" id="demoTabDesktop">Desktop Application</button>
    </div>
    <div class="demo-tab-content" id="demoMobileView">
      <div class="demo-screenshot-placeholder">
        <span style="font-weight:600;color:#f39c12;font-size:1.05rem;margin-bottom:6px;">Online Website for the Barangay District 1 (Mobile View)</span>
        <video controls style="max-width:100%;border-radius:12px;box-shadow:0 2px 8px #0002;">
          <source src="Videos-Projects/mobile-view-IBIMGIS.mp4" type="video/mp4">
          Your browser does not support the video tag.
        </video>
        <p style="margin-top:10px;">Mobile view demonstration video.</p>
      </div>
    </div>
    <div class="demo-tab-content" id="demoDesktopView" style="display:none;">
      <div class="demo-screenshot-placeholder">
        <span style="font-weight:600;color:#f39c12;font-size:1.05rem;margin-bottom:6px;">Desktop Application Screenshots</span>
        <div class="desktop-gallery">
          <img src="Videos-Projects/IMAGESS_IBIM/a.jpeg" alt="Desktop Screenshot 1">
          <img src="Videos-Projects/IMAGESS_IBIM/b.jpeg" alt="Desktop Screenshot 2">
          <img src="Videos-Projects/IMAGESS_IBIM/c.jpeg" alt="Desktop Screenshot 3">
          <img src="Videos-Projects/IMAGESS_IBIM/d.jpeg" alt="Desktop Screenshot 4">
          <img src="Videos-Projects/IMAGESS_IBIM/e.jpeg" alt="Desktop Screenshot 5">
          <img src="Videos-Projects/IMAGESS_IBIM/f.jpeg" alt="Desktop Screenshot 6">
          <img src="Videos-Projects/IMAGESS_IBIM/g.jpeg" alt="Desktop Screenshot 7">
          <img src="Videos-Projects/IMAGESS_IBIM/h.jpeg" alt="Desktop Screenshot 8">
          <img src="Videos-Projects/IMAGESS_IBIM/i.jpeg" alt="Desktop Screenshot 9">
        </div>
        <p style="margin-top:10px;">Desktop application screenshots gallery.</p>
      </div>
    </div>
  </div>
  <script>
    const demoTabMobile = document.getElementById('demoTabMobile');
    const demoTabDesktop = document.getElementById('demoTabDesktop');
    const demoMobileView = document.getElementById('demoMobileView');
    const demoDesktopView = document.getElementById('demoDesktopView');
    demoTabMobile.onclick = function() {
      demoTabMobile.classList.add('active');
      demoTabDesktop.classList.remove('active');
      demoMobileView.style.display = 'block';
      demoDesktopView.style.display = 'none';
    };
    demoTabDesktop.onclick = function() {
      demoTabDesktop.classList.add('active');
      demoTabMobile.classList.remove('active');
      demoMobileView.style.display = 'none';
      demoDesktopView.style.display = 'block';
    };
  </script>
</body>
</html>
